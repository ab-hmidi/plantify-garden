services:
  db:
    image: postgres:17
    container_name: plantify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantify
      POSTGRES_PASSWORD: plantify_dev_password
      POSTGRES_DB: plantify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
